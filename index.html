/* ============================ App logic ============================ */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const letter = i => String.fromCharCode(65 + i);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const withChapter = c => c.questions.map(q => ({ ...q, chapter: c.title }));
let state = null;

/* ---------- Home dashboard ---------- */
const MODES = [
  { scope: 'all',     order: 'order',  title: 'All Questions — In Order', desc: 'Every question from every chapter, in original order.', icon: '📋' },
  { scope: 'all',     order: 'random', title: 'All Questions — Random',   desc: 'Every question from every chapter, shuffled.',          icon: '🔀' },
  { scope: 'chapter', order: 'order',  title: 'By Chapter — In Order',    desc: 'Pick a chapter and answer it in order.',                icon: '📖' },
  { scope: 'chapter', order: 'random', title: 'By Chapter — Random',      desc: 'Pick a chapter and answer it shuffled.',                icon: '🎲' },
];

function renderHome() {
  state = null;
  const total = QUIZ_DATA.chapters.reduce((n, c) => n + c.questions.length, 0);
  app.innerHTML = `
    <header class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold text-indigo-700">${esc(QUIZ_DATA.title)}</h1>
      <p class="text-slate-500 mt-2">${QUIZ_DATA.chapters.length} chapters · ${total} questions</p>
    </header>
    <div class="grid gap-4 sm:grid-cols-2">
      ${MODES.map((m, i) => `
        <button onclick="pickMode(${i})" class="text-left bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:border-indigo-400 hover:shadow-md transition focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <div class="text-3xl mb-2">${m.icon}</div>
          <div class="font-semibold text-lg">${m.title}</div>
          <div class="text-sm text-slate-500 mt-1">${m.desc}</div>
        </button>`).join('')}
    </div>`;
}

function pickMode(i) {
  const m = MODES[i];
  if (m.scope === 'all') return start(m.order, QUIZ_DATA.chapters.flatMap(withChapter));
  app.innerHTML = `
    <button onclick="renderHome()" class="text-indigo-600 hover:underline mb-4">← Back</button>
    <h2 class="text-2xl font-bold mb-1">Choose a chapter</h2>
    <p class="text-slate-500 mb-5">${m.order === 'order' ? 'Questions will be asked in order.' : 'Questions will be shuffled.'}</p>
    <div class="grid gap-3">
      ${QUIZ_DATA.chapters.map((c, ci) => `
        <button onclick="pickChapter(${i}, ${ci})" class="flex items-center justify-between bg-white rounded-xl p-4 shadow-sm border border-slate-200 hover:border-indigo-400 hover:shadow-md transition text-left">
          <span class="font-medium">${esc(c.title)}</span>
          <span class="text-sm text-slate-500 whitespace-nowrap ml-3">${c.questions.length} questions</span>
        </button>`).join('')}
    </div>`;
}
const pickChapter = (mi, ci) => start(MODES[mi].order, withChapter(QUIZ_DATA.chapters[ci]));

/* ---------- Quiz ---------- */
function start(order, qs) {
  state = { order, source: qs, qs: order === 'random' ? shuffle(qs) : [...qs], i: 0, correct: 0, selected: new Set(), answered: false, ok: false };
  renderQuestion();
}

function optionClass(q, k) {
  const sel = state.selected.has(k), right = q.answer.includes(k);
  if (!state.answered) return sel ? 'border-indigo-500 bg-indigo-50' : 'border-slate-200 bg-white hover:border-indigo-300 hover:bg-slate-50';
  if (right && sel) return 'border-green-500 bg-green-100 text-green-900';
  if (!right && sel) return 'border-red-500 bg-red-100 text-red-900';
  if (right) return 'border-green-500 border-dashed bg-green-50 text-green-900';
  return 'border-slate-200 bg-white opacity-60';
}
function optionMark(q, k) {
  if (!state.answered) return '';
  const sel = state.selected.has(k), right = q.answer.includes(k);
  if (right && sel) return '✓';
  if (!right && sel) return '✗';
  return right ? '<span class="text-xs font-medium">missed</span>' : '';
}

function renderQuestion() {
  const q = state.qs[state.i], n = state.qs.length, multi = q.answer.length > 1;
  const last = state.i === n - 1;
  const correctLetters = q.answer.map(letter).join(', ');
  app.innerHTML = `
    <div class="flex items-center justify-between mb-2 text-sm text-slate-500">
      <span class="font-medium text-slate-700">Question ${state.i + 1} of ${n}</span>
      <button onclick="if(confirm('Quit this quiz?')) renderHome()" class="hover:text-red-600">Quit ✕</button>
    </div>
    <div class="h-2.5 bg-slate-200 rounded-full overflow-hidden mb-6">
      <div class="h-full bg-indigo-600 rounded-full transition-all duration-300" style="width:${Math.round(state.i / n * 100)}%"></div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-7">
      <div class="text-xs uppercase tracking-wide text-indigo-500 font-semibold mb-2">${esc(q.chapter)}</div>
      <h2 class="text-xl font-semibold mb-1">${esc(q.q)}</h2>
      ${multi ? '<p class="text-sm text-slate-500 mb-4">Select all correct answers, then press “Check answer”.</p>' : '<div class="mb-4"></div>'}
      <div class="grid gap-3">
        ${q.options.map((t, k) => `
          <button ${state.answered ? 'disabled' : ''} onclick="choose(${k})" class="flex items-start gap-3 text-left rounded-xl border-2 p-3.5 transition ${optionClass(q, k)}">
            <span class="font-bold w-6 shrink-0">${letter(k)}.</span>
            <span class="flex-1">${esc(t)}</span>
            <span class="font-bold shrink-0">${optionMark(q, k)}</span>
          </button>`).join('')}
      </div>
      ${state.answered ? `
        <div class="mt-5 rounded-xl p-3.5 text-sm font-medium ${state.ok ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}">
          ${state.ok ? '✓ Correct!' : `✗ Incorrect. Correct answer${q.answer.length > 1 ? 's' : ''}: ${correctLetters}`}
        </div>` : ''}
      <div class="mt-5 flex justify-end">
        ${state.answered
          ? `<button onclick="next()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2.5 rounded-xl shadow-sm">${last ? 'See Results' : 'Next Question'} →</button>`
          : multi ? `<button onclick="check()" ${state.selected.size ? '' : 'disabled'} class="bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold px-6 py-2.5 rounded-xl shadow-sm">Check answer</button>` : ''}
      </div>
    </div>`;
}

function choose(k) {
  if (state.answered) return;
  const q = state.qs[state.i];
  if (q.answer.length > 1) {
    state.selected.has(k) ? state.selected.delete(k) : state.selected.add(k);
    renderQuestion();
  } else {
    state.selected = new Set([k]);
    grade();
  }
}
const check = () => { if (state.selected.size) grade(); };

function grade() {
  const q = state.qs[state.i];
  state.ok = state.selected.size === q.answer.length && q.answer.every(k => state.selected.has(k));
  if (state.ok) state.correct++;
  state.answered = true;
  renderQuestion();
}

function next() {
  state.i++;
  state.selected = new Set();
  state.answered = false;
  state.i >= state.qs.length ? renderResults() : renderQuestion();
}

/* ---------- Results ---------- */
function renderResults() {
  const n = state.qs.length, c = state.correct, w = n - c, pct = Math.round(c / n * 100);
  const msg = pct >= 90 ? 'Outstanding! 🏆' : pct >= 70 ? 'Great job! 🎉' : pct >= 50 ? 'Not bad — keep practicing! 💪' : 'Keep going, you’ll get there! 📚';
  const color = pct >= 70 ? '#16a34a' : pct >= 50 ? '#f59e0b' : '#dc2626';
  const again = state;
  app.innerHTML = `
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-10 text-center">
      <h2 class="text-2xl font-bold mb-6">Quiz complete</h2>
      <div class="mx-auto w-40 h-40 rounded-full grid place-items-center" style="background:conic-gradient(${color} ${pct * 3.6}deg, #e2e8f0 0deg)">
        <div class="w-32 h-32 rounded-full bg-white grid place-items-center">
          <div><div class="text-4xl font-bold">${pct}%</div><div class="text-sm text-slate-500">${c} / ${n}</div></div>
        </div>
      </div>
      <p class="mt-5 text-lg font-medium">${msg}</p>
      <div class="grid grid-cols-3 gap-3 mt-6">
        <div class="rounded-xl bg-green-50 text-green-800 p-3"><div class="text-2xl font-bold">${c}</div><div class="text-xs uppercase">Correct</div></div>
        <div class="rounded-xl bg-red-50 text-red-800 p-3"><div class="text-2xl font-bold">${w}</div><div class="text-xs uppercase">Incorrect</div></div>
        <div class="rounded-xl bg-slate-100 text-slate-700 p-3"><div class="text-2xl font-bold">${n}</div><div class="text-xs uppercase">Total</div></div>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 justify-center mt-8">
        <button onclick="start('${again.order}', state.source)" class="px-6 py-2.5 rounded-xl border-2 border-indigo-600 text-indigo-700 font-semibold hover:bg-indigo-50">Try again</button>
        <button onclick="renderHome()" class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700">Back to Home</button>
      </div>
    </div>`;
}

renderHome();
</script>
</body>
</html>
